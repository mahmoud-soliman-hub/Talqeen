<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Fahd Birth Card</title>
<style>
@font-face{font-family:T;src:url(fonts/thm/thmanyahseriftext-Light.otf);font-weight:300}
@font-face{font-family:T;src:url(fonts/thm/thmanyahseriftext-Regular.otf);font-weight:400}
@font-face{font-family:T;src:url(fonts/thm/thmanyahseriftext-Medium.otf);font-weight:500}
@font-face{font-family:T;src:url(fonts/thm/thmanyahseriftext-Bold.otf);font-weight:700}
@font-face{font-family:T;src:url(fonts/thm/thmanyahseriftext-Black.otf);font-weight:900}

:root{
  --ink:#5a4836;
  --slate:#3f5670;
  --blue-deep:#33506d;
  --cx:545px;       /* horizontal centre of the arch moulding */
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#ece3d6}
body{font-family:T}
.card{position:relative;width:1080px;height:1920px;overflow:hidden}
.bg{position:absolute;left:0;top:-8px;width:1080px;height:auto;display:block}

/* soft light inside the arch, fades to nothing before any edge */
.glow{position:absolute;left:calc(var(--cx) - 330px);top:180px;width:660px;height:1100px;
  background:radial-gradient(closest-side at 50% 48%,rgba(255,252,246,.42) 0%,rgba(255,252,246,.18) 55%,rgba(255,252,246,0) 100%)}
.vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 95% 75% at 50% 40%,rgba(0,0,0,0) 62%,rgba(90,66,38,.14) 100%)}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.04;mix-blend-mode:multiply}

.stack{position:absolute;left:var(--cx);transform:translateX(-50%);width:470px;
  display:flex;flex-direction:column;align-items:center;text-align:center}

.foil{background:linear-gradient(172deg,#6c4a1a 0%,#a77b37 20%,#e6cd8e 38%,#b48944 54%,#7a5625 70%,#c9a25c 86%,#86602c 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1.5px 0 rgba(255,255,255,.7)) drop-shadow(0 3px 6px rgba(110,78,30,.22))}
.navy{background:linear-gradient(175deg,#6f8fb0 0%,#4c6c8c 32%,#33506d 70%,#46668a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 rgba(255,255,255,.65)) drop-shadow(0 8px 12px rgba(51,80,109,.18))}

.hero-gold{font-weight:900;font-size:122px;line-height:1.22;white-space:nowrap}
.lead{font-weight:500;font-size:38px;line-height:1.4;color:var(--slate);white-space:nowrap}
.lead-soft{font-weight:300;font-size:34px;line-height:1.4;color:var(--slate);white-space:nowrap}
.sub{font-weight:400;font-size:35px;line-height:1.45;color:var(--ink);white-space:nowrap}
.name{font-weight:700;font-size:214px;line-height:1.06;white-space:nowrap}
.father{font-weight:500;font-size:42px;line-height:1.3;color:var(--blue-deep);display:inline-flex;align-items:center;gap:16px;white-space:nowrap}
.rule{width:46px;height:1.5px;background:linear-gradient(90deg,rgba(167,123,55,0),#a77b37)}
.rule.l{background:linear-gradient(270deg,rgba(167,123,55,0),#a77b37)}
.dot{width:6px;height:6px;transform:rotate(45deg);background:#a77b37}
.dua{font-weight:400;font-size:33px;line-height:1.72;color:var(--ink);white-space:nowrap}
.from{font-weight:300;font-size:29px;color:var(--ink);line-height:1.3}
.sender{font-weight:700;font-size:42px;line-height:1.3;color:var(--blue-deep);display:inline-flex;align-items:center;gap:16px;white-space:nowrap}

.v2{display:none}
body.alt .v1{display:none}
body.alt .v2{display:flex}
</style>
</head>
<body>
<div class="card">
  <img class="bg" src="bg3/main.jpg" alt="">
  <div class="glow"></div>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7a5524"/><stop offset=".35" stop-color="#d9bb78"/>
        <stop offset=".6" stop-color="#a77b37"/><stop offset="1" stop-color="#7c5826"/>
      </linearGradient>
      <linearGradient id="fadeR" x1="0" x2="1"><stop offset="0" stop-color="#a77b37" stop-opacity="0"/><stop offset="1" stop-color="#a77b37"/></linearGradient>
      <linearGradient id="fadeL" x1="1" x2="0"><stop offset="0" stop-color="#a77b37" stop-opacity="0"/><stop offset="1" stop-color="#a77b37"/></linearGradient>
      <symbol id="star" viewBox="-50 -50 100 100">
        <g fill="none" stroke="url(#g)" stroke-width="3.2">
          <rect x="-30" y="-30" width="60" height="60"/>
          <rect x="-30" y="-30" width="60" height="60" transform="rotate(45)"/>
        </g>
        <circle r="13" fill="none" stroke="url(#g)" stroke-width="2.4"/>
        <circle r="5" fill="url(#g)"/>
      </symbol>
      <symbol id="ornTop" viewBox="0 0 250 56">
        <line x1="8" y1="28" x2="90" y2="28" stroke="url(#fadeR)" stroke-width="1.6"/>
        <line x1="160" y1="28" x2="242" y2="28" stroke="url(#fadeL)" stroke-width="1.6"/>
        <circle cx="96" cy="28" r="2.6" fill="#a77b37"/><circle cx="154" cy="28" r="2.6" fill="#a77b37"/>
        <use href="#star" x="99" y="3" width="52" height="50"/>
      </symbol>
      <symbol id="ornMid" viewBox="0 0 240 40">
        <line x1="8" y1="20" x2="94" y2="20" stroke="url(#fadeR)" stroke-width="1.4"/>
        <line x1="146" y1="20" x2="232" y2="20" stroke="url(#fadeL)" stroke-width="1.4"/>
        <use href="#star" x="102" y="2" width="36" height="36"/>
      </symbol>
      <symbol id="ornDot" viewBox="0 0 170 16">
        <line x1="0" y1="8" x2="70" y2="8" stroke="url(#fadeR)" stroke-width="1.4"/>
        <line x1="100" y1="8" x2="170" y2="8" stroke="url(#fadeL)" stroke-width="1.4"/>
        <rect x="79" y="2" width="12" height="12" transform="rotate(45 85 8)" fill="url(#g)"/>
      </symbol>
    </defs>
  </svg>

  <!-- ===== VARIANT 1 : congratulation from Mahmoud (default) ===== -->
  <div class="stack v1" style="top:268px">
    <svg width="230" height="52"><use href="#ornTop"/></svg>
    <div class="hero-gold foil" style="margin-top:8px">مبـارك</div>
    <div class="lead" style="margin-top:10px">أخي الغالي عبدالعزيز</div>
    <div class="lead-soft" style="margin-top:2px">قدوم مولودك</div>
    <div class="name navy" style="margin-top:14px">فهـــد</div>
    <svg width="220" height="37" style="margin-top:18px"><use href="#ornMid"/></svg>
    <div class="dua" style="margin-top:22px;font-size:31px">بُورك لك في الموهوب، وشكرتَ الواهب<br>وبلغ أشُدَّه، ورُزقتَ بِرَّه</div>
    <div class="from" style="margin-top:56px">أخوك</div>
    <div class="sender" style="margin-top:4px"><span class="rule l"></span><span class="dot"></span>محمود سليمان<span class="dot"></span><span class="rule"></span></div>
  </div>

  <!-- ===== VARIANT 2 : announcement (original content) ===== -->
  <div class="stack v2" style="top:270px">
    <svg width="230" height="52"><use href="#ornTop"/></svg>
    <div class="hero-gold foil" style="margin-top:4px;font-size:104px">الحمد لله</div>
    <div class="sub">الذي بنعمته تتم الصالحات</div>
    <svg width="170" height="16" style="margin-top:14px"><use href="#ornDot"/></svg>
    <div class="lead-soft" style="margin-top:10px">رزقنا الله بمولودنا</div>
    <div class="name navy" style="margin-top:2px">فهـــد</div>
    <div class="father"><span class="rule l"></span><span class="dot"></span>بن عبدالعزيز<span class="dot"></span><span class="rule"></span></div>
    <svg width="220" height="37" style="margin-top:24px"><use href="#ornMid"/></svg>
    <div class="dua" style="margin-top:14px;font-size:32px;line-height:1.66">اللهم أنبته نباتاً حسناً<br>واجعله قرّة عينٍ لنا<br>واجعله من الصالحين<br>واحفظه بعينك التي لا تنام</div>
  </div>

  <div class="vignette"></div>
  <svg class="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .4  0 0 0 0 .3  0 0 0 0 .2  0 0 0 1 0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>
<script>if(location.hash==='#alt')document.body.classList.add('alt')</script>
</body>
</html>
